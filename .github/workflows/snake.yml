name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Custom Red Snake, Yellow Dots, Light Green Background
      - name: Generate Snake (Red-Yellow-Green Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-red-yellow-green.svg?color_snake=#FF0000&color_dots=#FFD700&color_bg=#90EE90

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
