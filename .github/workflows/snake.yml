name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Default Dark Theme
      - name: Generate Snake (Dark Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      # Light Theme (clean white background + soft snake)
      - name: Generate Snake (Light Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-light.svg?color_snake=#FFD54F&color_dots=#FFECB3&color_bg=#FFFFFF

      # Stylish Yellow Theme
      - name: Generate Snake (Yellow Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-yellow.svg?color_snake=#FFC107&color_dots=#FFF176&color_bg=#FAFAFA

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
