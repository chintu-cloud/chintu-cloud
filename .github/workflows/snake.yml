name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history so git push works

      - name: Generate Snake (Default Dark Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud   # <-- replace with your GitHub username
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      - name: Generate Snake (Light Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-light.svg?palette=github-light

      - name: Generate Snake (Custom Neon Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-neon.svg?color_snake=#00ffcc&color_dots=#ff00ff&color_bg=#000000

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
