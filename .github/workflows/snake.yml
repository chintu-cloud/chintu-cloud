name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Custom Yellow Snake with Black Background
      - name: Generate Snake (Yellow Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-yellow.svg?color_snake=#FFD700&color_dots=#FFEB3B&color_bg=#000000

      # Neon Snake with Dark Gray Background
      - name: Generate Snake (Neon Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-neon.svg?color_snake=#00FFFF&color_dots=#FF00FF&color_bg=#1A1A1A

      # Sunset Snake with Purple Background
      - name: Generate Snake (Sunset Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-sunset.svg?color_snake=#FFB300&color_dots=#FFE082&color_bg=#2C2C54

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
