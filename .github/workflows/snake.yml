name: Generate Snake

on:
  schedule: # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Red Snake, Yellow Dots, Light Green Background
      - name: Generate Snake (Red-Yellow-Green Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-red-yellow-green.svg?color_snake=#FF0000&color_dots=#FFD700&color_bg=#90EE90

      # Pastel Rainbow Theme
      - name: Generate Snake (Pastel Rainbow Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-pastel.svg?color_snake=linear-gradient(#FFB3BA,#FFDFBA,#FFFFBA,#BAFFC9,#BAE1FF)&color_dots=#808080&color_bg=#FFFFFF

      # Cyberpunk Neon Theme
      - name: Generate Snake (Cyberpunk Neon Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-cyberpunk.svg?color_snake=#00FFFF&color_dots=#FF00FF&color_bg=#0D0D0D

      # Golden Glow Theme
      - name: Generate Snake (Golden Glow Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-golden.svg?color_snake=#FFD700&color_dots=#FFA500&color_bg=#001F3F

      # Ocean Blue Theme
      - name: Generate Snake (Ocean Blue Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-ocean.svg?color_snake=#1E90FF&color_dots=#00CED1&color_bg=#E0FFFF

      # Candy Pink Theme
      - name: Generate Snake (Candy Pink Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-candy.svg?color_snake=#FF69B4&color_dots=#FFC0CB&color_bg=#FFF0F5

      # Emerald Green Theme
      - name: Generate Snake (Emerald Green Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-emerald.svg?color_snake=#50C878&color_dots=#ADFF2F&color_bg=#F0FFF0

      # Midnight Purple Theme
      - name: Generate Snake (Midnight Purple Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-midnight.svg?color_snake=#8A2BE2&color_dots=#DA70D6&color_bg=#1A1A2E

      # Sky Blue Theme
      - name: Generate Snake (Sky Blue Theme)
        uses: Platane/snk@v3
        with:
          github_user_name: chintu-cloud
          outputs: |
            dist/snake-sky.svg?color_snake=#00BFFF&color_dots=#87CEFA&color_bg=#F0F8FF

      # Push all generated snakes to output branch
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
